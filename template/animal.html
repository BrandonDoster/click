    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 60vh;
            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;

            font-size: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
            box-shadow:
                0 10px 20px rgba(0, 0, 0, 0.2),
                0 6px 10px rgba(0, 0, 0, 0.15),
                inset 0 -3px 0 rgba(0, 0, 0, 0.1);
        }

        .button-3d:hover {
            box-shadow:
                0 12px 24px rgba(0, 0, 0, 0.2),
                0 8px 12px rgba(0, 0, 0, 0.15),
                inset 0 -3px 0 rgba(0, 0, 0, 0.1);
        }

        .button-3d:active {
            transform: translateY(4px);
            box-shadow:
                0 4px 8px rgba(0, 0, 0, 0.2),

                inset 0 -1px 0 rgba(0, 0, 0, 0.1);
        }

        .emoji { user-select: none; }

        .animated-emoji {
            position: fixed;
            font-size: 40px;
            pointer-events: none;
            z-index: 1000;
            opacity: 0;
            user-select: none;
        }

        @keyframes emojiPop {
            0%   { opacity: 0; transform: translateY(100px) scale(0.5); }
            20%  { opacity: 1; transform: translateY(0) scale(1.2); }
            40%  { transform: translateY(-20px) translateX(10px) scale(1); }
            60%  { transform: translateY(-10px) translateX(-15px) scale(1.1); }
            80%  { transform: translateY(-30px) translateX(20px) scale(0.9); }
            100% { opacity: 0; transform: translateY(-50px) translateX(0) scale(0.5); }
        }

        .animated-emoji.show {
            animation: emojiPop 2s ease-out forwards;
        }

        .home-link {
            position: fixed;

<body>
    <a class="home-link" href="../" aria-label="All animals">← all</a>
    <button class="button-3d" id="emojiButton">
        <span class="emoji">{{ANIMAL_EMOJI}}</span>
    </button>
    <div class="unmute-notification">Unmute your phone if you don't hear sound 🔊</div>
    <div class="about-me">Inspired by <a href="https://lizard.click/">lizard.click</a></div>

    <script>
        const ANIMAL_EMOJI = "{{ANIMAL_EMOJI}}";
        const SOUND_FILE = "{{SOUND_FILE}}";

        const button = document.getElementById('emojiButton');

        // Audio: Web Audio API for low-latency playback, HTML Audio pool as fallback.
        const audioPool = [];
        const poolSize = 5;
        let currentAudioIndex = 0;
        let audioBuffer = null;
        let audioContext = null;

        function initializeAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioContext;
        }

        async function loadAudioBuffer() {
            if (audioBuffer) return audioBuffer;
            try {
                const ctx = initializeAudioContext();
                const res = await fetch(SOUND_FILE);
                const buf = await res.arrayBuffer();
                audioBuffer = await ctx.decodeAudioData(buf);
                return audioBuffer;
            } catch (err) {
                console.log('Web Audio buffer load failed, will use HTML Audio:', err);
                return null;
            }
        }

        for (let i = 0; i < poolSize; i++) {
            const a = new Audio(SOUND_FILE);
            a.preload = 'auto';
            a.volume = 1.0;
            audioPool.push(a);
        }

        function createAnimatedEmoji() {
            const el = document.createElement('div');
            el.className = 'animated-emoji';
            el.textContent = ANIMAL_EMOJI;

            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight * 0.6) + (window.innerHeight * 0.2);
            el.style.left = x + 'px';
            el.style.top = y + 'px';

            document.body.appendChild(el);
            setTimeout(() => el.classList.add('show'), 10);
            setTimeout(() => {
                if (el.parentNode) document.body.removeChild(el);
            }, 2000);
        }

        async function playSound() {
            if (audioBuffer && audioContext) {
                try {
                    if (audioContext.state === 'suspended') {
                        await audioContext.resume();
                    }
                    const src = audioContext.createBufferSource();
                    src.buffer = audioBuffer;
                    src.connect(audioContext.destination);
                    src.start(0);
                    createAnimatedEmoji();
                    return;
                } catch (err) {
                    console.log('Web Audio play failed, falling back:', err);
                }
            }

            const a = audioPool[currentAudioIndex];
            if (!a.paused) a.pause();
            a.currentTime = 0;
            try { await a.play(); } catch (_) { /* swallow */ }

            createAnimatedEmoji();
            currentAudioIndex = (currentAudioIndex + 1) % poolSize;
        }

        button.addEventListener('click', playSound);

        window.addEventListener('load', async () => {
            await loadAudioBuffer().catch(() => {});
            audioPool.forEach(a => a.load());
        });
    </script>
</body>
